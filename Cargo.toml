[workspace]
members = [".", "pyrowave-sys"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.87"
license = "MIT"
repository = "https://github.com/lutyjj/pyrowave-rs"

[package]
name = "pyrowave"
description = "Rust ownership and configuration for the official PyroWave Vulkan codec"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
rust-version.workspace = true
publish = false

[features]
default = []
dmabuf = []

[dependencies]
pyrowave-sys = { version = "0.1.0", path = "pyrowave-sys" }
thiserror = "2.0"
